<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eval Review</title>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #0b1020;
      color: #e5e7eb;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid #1f2937;
      background: #111827;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 20px;
    }
    .meta {
      color: #9ca3af;
      font-size: 14px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid #1f2937;
      background: #0f172a;
    }
    button {
      border: 1px solid #334155;
      background: #1e293b;
      color: #e5e7eb;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    button.active {
      background: #2563eb;
      border-color: #2563eb;
    }
    main {
      padding: 20px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
    }
    .hidden {
      display: none;
    }
    .run-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .muted {
      color: #9ca3af;
    }
    .prompt, pre, textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e5e7eb;
      padding: 12px;
    }
    pre {
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .file-list {
      display: grid;
      gap: 12px;
    }
    .file-title {
      margin-bottom: 8px;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #1f2937;
      text-align: left;
      vertical-align: top;
    }
    a {
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Eval Review</h1>
    <div class="meta" id="subtitle"></div>
  </header>

  <div class="toolbar">
    <button id="tabOutputs" class="active" onclick="showTab('outputs')">Outputs</button>
    <button id="tabBenchmark" onclick="showTab('benchmark')">Benchmark</button>
    <button onclick="saveFeedback()">Save Feedback</button>
    <button onclick="downloadFeedback()">Download Feedback</button>
  </div>

  <main>
    <section id="outputsTab" class="card">
      <div class="run-nav">
        <button onclick="changeRun(-1)">Previous</button>
        <div id="runLabel"></div>
        <button onclick="changeRun(1)">Next</button>
      </div>

      <div class="muted" style="margin-bottom:8px;">Prompt</div>
      <div id="prompt" class="prompt"></div>

      <div class="muted" style="margin:16px 0 8px;">Outputs</div>
      <div id="outputs" class="file-list"></div>

      <div class="muted" style="margin:16px 0 8px;">Feedback</div>
      <textarea id="feedbackBox" placeholder="What should improve for this run? Leave blank if it looks good."></textarea>
    </section>

    <section id="benchmarkTab" class="card hidden">
      <div id="benchmarkContent"></div>
    </section>
  </main>

  <script>
    /*__EMBEDDED_DATA__*/

    const data = EMBEDDED_DATA;
    const runs = data.runs || [];
    let currentIndex = 0;
    const feedback = {};

    function showTab(tab) {
      document.getElementById('outputsTab').classList.toggle('hidden', tab !== 'outputs');
      document.getElementById('benchmarkTab').classList.toggle('hidden', tab !== 'benchmark');
      document.getElementById('tabOutputs').classList.toggle('active', tab === 'outputs');
      document.getElementById('tabBenchmark').classList.toggle('active', tab === 'benchmark');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    function renderRun() {
      if (!runs.length) {
        document.getElementById('runLabel').textContent = 'No runs found';
        return;
      }

      const run = runs[currentIndex];
      document.getElementById('title').textContent = `Eval Review: ${data.skill_name || 'artifact'}`;
      document.getElementById('subtitle').textContent = `${runs.length} run(s) loaded`;
      document.getElementById('runLabel').textContent = `${currentIndex + 1} / ${runs.length} - ${run.id}`;
      document.getElementById('prompt').textContent = run.prompt || '(No prompt)';

      const outputRoot = document.getElementById('outputs');
      outputRoot.innerHTML = '';

      for (const file of run.outputs || []) {
        const card = document.createElement('div');
        card.className = 'card';
        const title = document.createElement('div');
        title.className = 'file-title';
        title.textContent = file.name;
        card.appendChild(title);

        if (file.type === 'text') {
          const pre = document.createElement('pre');
          pre.textContent = file.content;
          card.appendChild(pre);
        } else if (file.type === 'image') {
          const img = document.createElement('img');
          img.src = file.data_uri;
          img.style.maxWidth = '100%';
          card.appendChild(img);
        } else if (file.type === 'pdf') {
          const link = document.createElement('a');
          link.href = file.data_uri;
          link.textContent = 'Open embedded PDF';
          link.target = '_blank';
          card.appendChild(link);
        } else if (file.type === 'xlsx') {
          const pre = document.createElement('pre');
          pre.textContent = 'Spreadsheet captured as base64 payload for download-only review.';
          card.appendChild(pre);
        } else {
          const link = document.createElement('a');
          link.href = file.data_uri || '#';
          link.textContent = 'Download binary output';
          link.target = '_blank';
          card.appendChild(link);
        }

        outputRoot.appendChild(card);
      }

      const prior = (data.previous_feedback || {})[run.id] || '';
      const current = feedback[run.id] ?? prior;
      document.getElementById('feedbackBox').value = current;
    }

    function changeRun(delta) {
      persistCurrentFeedback();
      if (!runs.length) return;
      currentIndex = (currentIndex + delta + runs.length) % runs.length;
      renderRun();
    }

    function persistCurrentFeedback() {
      if (!runs.length) return;
      feedback[runs[currentIndex].id] = document.getElementById('feedbackBox').value;
    }

    async function saveFeedback() {
      persistCurrentFeedback();
      const payload = {
        reviews: runs.map(run => ({
          run_id: run.id,
          feedback: feedback[run.id] || '',
          timestamp: new Date().toISOString()
        })),
        status: 'in_progress'
      };

      try {
        await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn('Save failed; use Download Feedback instead.', err);
      }
    }

    function downloadFeedback() {
      persistCurrentFeedback();
      const payload = {
        reviews: runs.map(run => ({
          run_id: run.id,
          feedback: feedback[run.id] || '',
          timestamp: new Date().toISOString()
        })),
        status: 'complete'
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'feedback.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderBenchmark() {
      const root = document.getElementById('benchmarkContent');
      if (!data.benchmark) {
        root.innerHTML = '<div class="muted">No benchmark data loaded.</div>';
        return;
      }

      const summary = data.benchmark.run_summary || {};
      const rows = Object.entries(summary)
        .filter(([key]) => key !== 'delta')
        .map(([name, stats]) => `
          <tr>
            <td>${escapeHtml(name)}</td>
            <td>${stats.pass_rate?.mean ?? 0}</td>
            <td>${stats.time_seconds?.mean ?? 0}</td>
            <td>${stats.tokens?.mean ?? 0}</td>
          </tr>
        `)
        .join('');

      const delta = summary.delta || {};
      root.innerHTML = `
        <div class="muted" style="margin-bottom:12px;">${escapeHtml(data.benchmark.metadata?.skill_name || data.skill_name || 'artifact')}</div>
        <table>
          <thead>
            <tr>
              <th>Configuration</th>
              <th>Pass Rate</th>
              <th>Time Seconds</th>
              <th>Tokens</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>
        <div style="margin-top:12px;" class="muted">
          Delta: pass rate ${escapeHtml(delta.pass_rate || 'n/a')},
          time ${escapeHtml(delta.time_seconds || 'n/a')},
          tokens ${escapeHtml(delta.tokens || 'n/a')}
        </div>
      `;
    }

    document.getElementById('feedbackBox').addEventListener('input', persistCurrentFeedback);
    renderRun();
    renderBenchmark();
  </script>
</body>
</html>
